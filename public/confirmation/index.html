<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you</title>
<link rel="stylesheet" href="../store.css">
</head>
<body>
<header class="fp-head">
  <a class="fp-logo" id="logo" href="https://www.fruitypuppy.com/" data-site-home>Shop</a>
  <nav><a href="https://www.fruitypuppy.com/" data-site-home>Home</a> <a href="../" data-shop-home>Shop</a></nav>
</header>
<main class="confirm">
  <h1 id="confirm-title">Thank you.</h1>
  <p id="confirm-copy">Checking your payment&hellip;</p>
  <p id="session" class="muted"></p>
  <ul id="items" class="confirm-items" hidden></ul>
  <p id="total" hidden></p>
  <a class="add" href="../" data-shop-home>Back to the shop</a>
</main>
<footer class="fp-foot"><a href="../" data-shop-home>Back to shop</a><p class="fp-social"><a href="https://x.com/FruityPuppyIpo" target="_blank" rel="noopener noreferrer" aria-label="Fruity Puppy on X" title="X"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4h4.6L20 20h-4.6z"/><path d="M19.6 4l-6.4 7.1M4.4 20l6.4-7.1"/></svg></a><a href="https://www.instagram.com/fruitypuppyskincream" target="_blank" rel="noopener noreferrer" aria-label="Fruity Puppy on Instagram" title="Instagram"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/></svg></a><a href="https://www.tiktok.com/@fruitypuppy.com" target="_blank" rel="noopener noreferrer" aria-label="Fruity Puppy on TikTok" title="TikTok"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.9 2.4 4.7 5 4.9"/></svg></a><a href="https://youtube.com/@fruitypuppyskinscience" target="_blank" rel="noopener noreferrer" aria-label="Fruity Puppy on YouTube" title="YouTube"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg></a><a href="https://www.facebook.com/share/g/19fXBNPvgW/" target="_blank" rel="noopener noreferrer" aria-label="Fruity Puppy on Facebook" title="Facebook"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 3h-2.4A3.6 3.6 0 0 0 9 6.6V21"/><path d="M6 10.5h8"/></svg></a></p></footer>
<script>
const BASE = location.pathname.startsWith('/store') ? '/store' : '';
const params = new URLSearchParams(location.search);
const brand = params.get('brand') || (location.hostname.includes('brobots') ? 'brobots' : '');
const key = 'store-cart-' + (brand || 'default');
localStorage.removeItem(key);
if (brand) document.querySelectorAll('.fp-social').forEach(el => el.remove());
localStorage.removeItem('fp-cart');
const id = params.get('session_id');
const title = document.getElementById('confirm-title');
const copy = document.getElementById('confirm-copy');
const MSG = {
  paid: ['Order confirmed.', 'We got your payment and your order is in our queue. A confirmation email is on its way.'],
  pending: ['Payment processing.', 'Your payment is still processing. We will email you once it clears.'],
  failed: ['Payment did not go through.', 'Your order was not placed. You can return to the shop and try again.'],
  expired: ['Checkout expired.', 'Your order was not placed. You can return to the shop and try again.'],
  refunded: ['Order refunded.', 'This order has been refunded to your card.'],
  none: ['Thank you.', 'Thanks for visiting the shop.'],
  fallback: ['Payment received.', 'Thank you! Your confirmation email is on its way.'],
};
function show(k) { const m = MSG[k] || MSG.fallback; title.textContent = m[0]; copy.textContent = m[1]; }
const fmt = (c, cur) => new Intl.NumberFormat('en-US', { style: 'currency', currency: (cur || 'usd').toUpperCase() }).format(c / 100);
function details(d) {
  if (d.order_number) document.getElementById('session').textContent = 'Order ' + d.order_number;
  const ul = document.getElementById('items');
  if (Array.isArray(d.items) && d.items.length) {
    ul.textContent = '';
    d.items.forEach(i => {
      const li = document.createElement('li');
      li.textContent = i.quantity + ' \u00d7 ' + i.title + (i.note ? ' (' + i.note + ')' : '') + (i.amount_total_cents != null ? '  ' + fmt(i.amount_total_cents, d.currency) : '');
      ul.appendChild(li);
    });
    ul.hidden = false;
  }
  if (d.total_cents != null) { const t = document.getElementById('total'); t.textContent = 'Total paid: ' + fmt(d.total_cents, d.currency); t.hidden = false; }
}
if (id && id !== '{CHECKOUT_SESSION_ID}') {
  document.getElementById('session').textContent = 'Order ' + id.slice(0, 18);
  let tries = 0;
  const poll = () => fetch(BASE + '/api/order-status?session_id=' + encodeURIComponent(id))
    .then(r => r.json()).then(d => {
      if (d.status === 'processing' && ++tries < 6) return setTimeout(poll, 2000);
      show(d.status === 'processing' ? 'fallback' : d.status);
      if (d.status === 'paid' || d.status === 'refunded') details(d);
    }).catch(() => show('fallback'));
  poll();
} else { show('none'); }
const q = brand ? '?brand=' + brand : '';
document.querySelectorAll('a[data-shop-home]').forEach(a => { a.href = (BASE || '/') + q; });
const SITE_HOME = { brobots: 'https://brobots.space/', kudoken: 'https://kudoken.space/' }[brand] || (BASE ? '/' : 'https://www.fruitypuppy.com/');
document.querySelectorAll('a[data-site-home]').forEach(a => { a.href = SITE_HOME; });
fetch(BASE + '/api/catalog' + q).then(r => r.json()).then(data => {
  const name = data.store && data.store.name;
  if (name) {
    document.getElementById('logo').textContent = name;
    document.title = 'Thank you · ' + name;
  }
}).catch(() => {});
</script>
<script>(function(){var s=document.createElement('script');s.src=(location.pathname.indexOf('/store')===0?'/store':'')+'/signup.js';s.defer=true;document.head.appendChild(s)})()</script>
<script defer src="/_vercel/insights/script.js"></script>
</body></html>
